name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    # GitHub's image with Xcode 27 and iPadOS 27 simulators (public preview as of October 2026).
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Lint
        run: Scripts/lint.sh

  test:
    name: Package tests, app build, unit and UI tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Package tests
        run: |
          swift build --build-tests --package-path Packages/CarrelKit -Xswiftc -warnings-as-errors
          swift test --skip-build --package-path Packages/CarrelKit

      - name: Build and test the app
        run: Scripts/test.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Carrel.xcresult
          path: |
            build/Carrel.xcresult
            ~/Library/Logs/DiagnosticReports/*.ips
          retention-days: 7
